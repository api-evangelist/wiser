aid: wiser
name: Wiser
description: >-
  Wiser Solutions is a retail and commerce intelligence company that provides
  pricing, market, and MAP (minimum advertised price) intelligence to brands and
  retailers. Its platform collects online and in-store data, tracking billions of
  products daily across hundreds of thousands of stores, to power price
  optimization, competitive price monitoring, promotion and assortment tracking,
  review analytics, and unauthorized-seller enforcement. Wiser serves hundreds of
  brands and large retailers and integrates with major eCommerce platforms and
  marketplaces. As of this profile Wiser publishes no public developer API,
  SDKs, or developer portal; integrations are delivered through its platform,
  dashboards, and partner connectors.
